<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lagom Lens</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Lagom Lens</h1>

  <label class="row">
    <span>Enabled</span>
    <input type="checkbox" id="enabled" />
  </label>

  <div class="lang-swap-row">
    <label class="lang-field">
      <span>From</span>
      <select id="sourceLang">
        <option value="sv">Svenska</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="pl">Polski</option>
        <option value="ru">Русский</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="hi">हिन्दी</option>
      </select>
    </label>

    <button type="button" id="swapLangs" class="swap-btn" title="Swap languages" aria-label="Swap languages">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 7h11l-3-3" />
        <path d="M17 17H6l3 3" />
      </svg>
    </button>

    <label class="lang-field">
      <span>To</span>
      <select id="targetLang">
        <option value="sv">Svenska</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="pl">Polski</option>
        <option value="ru">Русский</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="hi">हिन्दी</option>
      </select>
    </label>
  </div>

  <p class="hint">
    Hover a word in the subtitles to see its translation.
  </p>

  <p class="status" id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
